# PostgreSQL para desenvolvimento local.
# A senha vem do arquivo .env (copie .env.example → .env). Nunca versionar o .env.
services:
  postgres:
    image: postgres:17-alpine
    container_name: orcafacil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orcafacil
      POSTGRES_USER: orcafacil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - orcafacil-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcafacil -d orcafacil"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orcafacil-pgdata:
